[project]
name = "schneider-data-challenge-2026"
version = "0.1.0"
description = "Schneider Electric Data Challenge 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "xgboost",
    "lightgbm",
    "openpyxl>=3.1.5",
    "statsmodels>=0.15.0",
    "pyyaml",
    "scipy",
    "requests",
    "joblib",
]

[dependency-groups]
ai = [
    "anthropic>=2.12.0",
    "chronos-forecasting>=2.0",
    "python-dotenv>=1.2.4",
    "torch>=2.15.0",
]
dev = [
    "jupyterlab",
    "ipykernel",
    "pytest>=9.2.0",
]

[tool.uv]
package = false
