  - {country: US, industry: utilities, note: "Southern California Edison installs GM AirSeT from 2027; New York phase-out from 2027.", source: "https://www.tdworld.com/substations/news/55387913/schneider-electric-sce-to-deploy-sf6-free-substation-tech-to-boost-grid-capacity"}
  - {country: CN, industry: data_centres, note: "New hub data centres must run on over 80% green power: Scope 1 is the remaining lever.", source: "https://www.gov.cn/zhengce/zhengceku/202407/P020240724272072479001.pdf"}
