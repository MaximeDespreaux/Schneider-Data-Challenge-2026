# Availability table: ONE row per series. Single source of truth for publication lags (spec 5.2).
# realtime_lag: a buyer deciding mid-month t sees reference month t - realtime_lag (providers' release calendars,
#   not the download date). Monthly averages of daily prices are incomplete mid-month, hence lag 1.
# revision_months: how long a published value keeps being revised (informational; truth = latest vintage).
# vintages: false everywhere (first releases are not stored, see spec non-goals).
# Submission mode does NOT use realtime_lag: it mirrors the live ragged edge (availability.ragged_edge_lags).
# No values in this file: it is committed.

